<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>호제야 다운받자</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root {
  --bg:     #0f0f0f;
  --bg2:    #161616;
  --bg3:    #1e1e1e;
  --bg4:    #272727;
  --accent: #00d4aa;
  --accent-dim: rgba(0,212,170,.12);
  --accent-dim2: rgba(0,212,170,.06);
  --text:   #e2e2e2;
  --text2:  #999;
  --text3:  #555;
  --border: #2a2a2a;
  --border2:#383838;
  --danger: #ff5555;
  --r:      12px;
  --r2:     8px;
  --r3:     6px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ── HEADER ── */
.header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:200;
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
}
.header-title{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:-.5px;}
.header-notice{font-size:11px;color:var(--text3);white-space:nowrap;}

/* ── TAB NAV ── */
.tab-nav{
  display:flex;gap:0;overflow-x:auto;
  background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;
}
.tab-nav::-webkit-scrollbar{height:0;}
.tab-btn{
  padding:10px 18px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--text2);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;
  white-space:nowrap;transition:color .15s,border-color .15s;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}

/* ── LAYOUT ── */
.wrap{padding:20px 16px;max-width:680px;margin:0 auto;}

/* ── CP COMPONENTS ── */
.cp-tab-wrap{max-width:600px;margin:24px auto;padding:0 8px;}
.cp-head-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.cp-head-title{font-size:15px;font-weight:600;flex:1;}
.cp-label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;}
.cp-input{
  width:100%;background:var(--bg3);border:1px solid var(--border2);
  color:var(--text);font-family:inherit;font-size:13px;
  padding:9px 11px;border-radius:var(--r2);outline:none;transition:border-color .2s;
}
.cp-input:focus{border-color:var(--accent);}
.cp-btn{
  margin-top:12px;width:100%;padding:12px;border:none;border-radius:var(--r2);
  background:#e52228;color:#fff;font-family:inherit;font-size:14px;font-weight:700;
  cursor:pointer;transition:opacity .2s;
}
.cp-btn:hover{opacity:.85;}
.cp-btn:disabled{opacity:.5;cursor:not-allowed;}
.cp-result{
  margin-top:12px;padding:11px 13px;border-radius:var(--r2);
  font-size:13px;word-break:break-all;line-height:1.6;
  border:1px solid var(--border2);background:var(--bg3);color:var(--text);
}
.cp-result.err{border-color:var(--danger);background:rgba(255,85,85,.06);color:var(--danger);}

/* ── SPINNER ── */
.spin{
  display:inline-block;width:14px;height:14px;
  border:2px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;
}
@keyframes sp{to{transform:rotate(360deg);}}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:22px;right:22px;
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  padding:9px 16px;border-radius:var(--r2);font-size:12px;z-index:9999;
  transform:translateY(60px);opacity:0;transition:all .28s;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{border-color:var(--accent);color:var(--accent);}

/* ── SECTION DIVIDER ── */
.section-divider{
  border:none;border-top:1px solid var(--border);
  margin:28px 0;
}
</style>
</head>
<body>

<header class="header">
  <span class="header-title">📥 호제야 다운받자</span>
  <span class="header-notice">무단배포 적발시 유료화합니다</span>
</header>

<div class="wrap">
  <div class="cp-tab-wrap">
    <div class="cp-head-row"><span class="cp-head-title">📥 영상 다운로드</span></div>
    <div class="cp-label">틱톡 / 스레드 / 샤오홍슈 URL</div>
    <input class="cp-input" id="_dlUrl" type="text" placeholder="틱톡·스레드·샤오홍슈 링크 붙여넣기" style="font-size:13px;">
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="cp-btn" id="_dlBtn" style="margin-top:0;flex:1;">가져오기</button>
      <button class="cp-btn" id="_dlClear" style="margin-top:0;flex:0 0 auto;width:auto;padding:12px 16px;background:var(--bg4);color:var(--text2);border:1px solid var(--border2);">URL 지우기</button>
    </div>
    <div id="_dlResult" style="display:none;margin-top:16px;"></div>
    <div id="_dlErr" style="display:none;margin-top:12px;" class="cp-result err"></div>
  </div>
</div><!-- /wrap -->

<div class="toast" id="toastEl"></div>

<script>
// ── 상수 ──────────────────────────────────────────────────────────────────────
const PROXY       = 'https://corsproxy.io/?';
const MEDIA_PROXY = 'https://media-proxy.billivilli.workers.dev/?url=';
const CP_THREADS_API = 'https://media-proxy.billivilli.workers.dev/threads-images';

// ── 토스트 ────────────────────────────────────────────────────────────────────
let _toastTimer;
function toast(msg, ok){
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.className = 'toast show' + (ok ? ' ok' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// (탭 제거 — 통합 다운로더)

// ── 미디어 fetching (MEDIA_PROXY 우선) ───────────────────────────────────────
async function _fetchBlob(url){
  for(const target of [
    MEDIA_PROXY + encodeURIComponent(url),
    url,
    PROXY + encodeURIComponent(url),
  ]){
    try{
      const r = await fetch(target);
      if(r.ok) return await r.blob();
    } catch(e){}
  }
  return null;
}

// ── 미디어 저장 ───────────────────────────────────────────────────────────────
async function dlMedia(url, filename){
  toast('다운로드 중...', true);
  const isVideo = filename.endsWith('.mp4');
  const mime    = isVideo ? 'video/mp4' : 'image/jpeg';
  const isIOS   = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  const blob = await _fetchBlob(url);
  if(blob){
    const file = new File([blob], filename, {type: mime});
    if(isIOS && navigator.canShare?.({files:[file]})){
      try{ await navigator.share({files:[file], title: filename}); return; }
      catch(e){ if(e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toast('다운로드 완료 ✓', true);
    return;
  }
  window.open(MEDIA_PROXY + encodeURIComponent(url), '_blank');
  toast('파일 저장 화면이 열립니다');
}

// ── 영상 저장 오버레이 (iOS 꾹 누르기 안내) ──────────────────────────────────
function _showVideoSaveOverlay(videoUrl){
  const old = document.getElementById('_vidSaveOverlay');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = '_vidSaveOverlay';
  overlay.style.cssText = `
    position:fixed;inset:0;z-index:9999;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  `;
  overlay.innerHTML = `
    <div style="position:absolute;top:14px;right:14px;">
      <button id="_vidOverlayClose" style="background:rgba(255,255,255,0.15);border:none;color:#fff;
        width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1;">✕</button>
    </div>
    <video src="${videoUrl}" controls playsinline autoplay
      style="width:100%;max-height:70vh;object-fit:contain;"></video>
    <div style="text-align:center;padding:0 24px;">
      <div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:8px;">📱 영상을 꾹 눌러 저장하세요</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.7);line-height:1.7;">
        위 영상에서 손가락으로 <b style="color:#fff">꾹 누르기</b><br>
        → <b style="color:#4ade80">"비디오 저장"</b> 선택<br>
        <span style="font-size:11px;color:rgba(255,255,255,0.45);">(iOS Safari · Android Chrome 지원)</span>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('_vidOverlayClose').onclick = () => overlay.remove();
}

// ════════════════════════════════════════════════════════════
//  영상 다운로드 (틱톡 / 스레드 / 샤오홍슈 자동감지)
// ════════════════════════════════════════════════════════════
(function(){
  const q = id => document.getElementById(id);
  q('_dlClear').onclick = () => { q('_dlUrl').value=''; q('_dlResult').style.display='none'; q('_dlResult').innerHTML=''; q('_dlErr').style.display='none'; q('_dlUrl').focus(); };
  q('_dlBtn').onclick = async () => {
    const url = q('_dlUrl').value.trim();
    if(!url){ toast('URL을 입력해주세요'); return; }
    const btn = q('_dlBtn'); btn.disabled=true; const ot=btn.textContent; btn.innerHTML='<span class="spin"></span> 분석 중...';
    q('_dlResult').style.display='none'; q('_dlResult').innerHTML=''; q('_dlErr').style.display='none';
    try{
      let videos=[], images=[], platform='';
      if(/tiktok\.com|vt\.tiktok|vm\.tiktok/i.test(url)){
        platform='틱톡';
        const j=await (await fetch('https://tikwm.com/api/?url='+encodeURIComponent(url)+'&hd=1',{signal:AbortSignal.timeout(20000)})).json();
        if(j.code!==0||!j.data) throw new Error(j.msg||'틱톡 정보를 가져올 수 없습니다');
        if(j.data.play) videos=[j.data.play];
        if(j.data.images) images=j.data.images;
      } else if(/threads\.(net|com)/i.test(url)){
        platform='스레드';
        const d=await (await fetch(CP_THREADS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url}),signal:AbortSignal.timeout(25000)})).json();
        if(d.error) throw new Error(d.error); videos=d.videos||[]; images=d.images||[];
      } else if(/xhslink\.com|xiaohongshu\.com/i.test(url)){
        platform='샤오홍슈';
        const d=await (await fetch('https://cp-converter.vercel.app/api/xhs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url}),signal:AbortSignal.timeout(25000)})).json();
        if(d.error) throw new Error(d.error); videos=d.videos||[]; images=d.images||[];
      } else { throw new Error('지원하지 않는 URL (틱톡/스레드/샤오홍슈)'); }
      const total=videos.length+images.length;
      if(!total) throw new Error('미디어를 찾을 수 없습니다');
      const cont=q('_dlResult'); const ts=Date.now();
      const slider=document.createElement('div');
      slider.style.cssText='display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:6px;';
      const mk=(kind,u,idx,cnt)=>{
        const it=document.createElement('div');
        it.style.cssText='flex:0 0 70%;scroll-snap-align:start;position:relative;aspect-ratio:4/3;background:#000;border-radius:10px;overflow:hidden;';
        const psrc = MEDIA_PROXY+encodeURIComponent(u);
        it.innerHTML = (kind==='video'
          ? '<video src="'+psrc+'" controls playsinline style="width:100%;height:100%;object-fit:contain;background:#000;"></video>'
          : '<img src="'+psrc+'" style="width:100%;height:100%;object-fit:contain;background:#000;">')
          + '<span style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;pointer-events:none;">'+(kind==='video'?'🎬':'🖼️')+(cnt>1?' '+(idx+1):'')+'</span>';
        return it;
      };
      videos.forEach((u,i)=>slider.appendChild(mk('video',u,i,videos.length)));
      images.forEach((u,i)=>slider.appendChild(mk('image',u,i,images.length)));
      cont.appendChild(slider);
      const dlRow=document.createElement('div'); dlRow.style.cssText='display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;';
      const mkDl=(kind,u,idx,cnt)=>{
        const fname = kind==='video' ? platform+'_'+ts+'_v'+(idx+1)+'.mp4' : platform+'_'+ts+'_'+(idx+1)+'.jpg';
        const b=document.createElement('button'); b.className='cp-btn'; b.style.cssText='margin:0;flex:1 1 130px;font-size:13px;';
        b.textContent='📥 '+(kind==='video'?'영상':'사진')+(cnt>1?' '+(idx+1):'')+' 다운로드';
        b.onclick=async function(){ const o=this.textContent; this.disabled=true; this.textContent='다운로드 중...'; try{ await dlMedia(u, fname); } finally{ this.disabled=false; this.textContent=o; } };
        return b;
      };
      videos.forEach((u,i)=>dlRow.appendChild(mkDl('video',u,i,videos.length)));
      images.forEach((u,i)=>dlRow.appendChild(mkDl('image',u,i,images.length)));
      cont.appendChild(dlRow);
      cont.style.display='block';
      toast(platform+' 미디어 '+total+'개', true);
    }catch(e){ q('_dlErr').style.display='block'; q('_dlErr').textContent='오류: '+(e.name==='TimeoutError'?'시간초과(다시 시도)':e.message); }
    finally{ btn.disabled=false; btn.innerHTML=ot; }
  };
})();
</script>
</body>
</html>
