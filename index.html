<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>호제야 다운받자</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root {
  --bg:     #0f0f0f;
  --bg2:    #161616;
  --bg3:    #1e1e1e;
  --bg4:    #272727;
  --accent: #00d4aa;
  --accent-dim: rgba(0,212,170,.12);
  --accent-dim2: rgba(0,212,170,.06);
  --text:   #e2e2e2;
  --text2:  #999;
  --text3:  #555;
  --border: #2a2a2a;
  --border2:#383838;
  --danger: #ff5555;
  --r:      12px;
  --r2:     8px;
  --r3:     6px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ── HEADER ── */
.header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:200;
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
}
.header-title{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:-.5px;}
.header-notice{font-size:11px;color:var(--text3);white-space:nowrap;}

/* ── TAB NAV ── */
.tab-nav{
  display:flex;gap:0;overflow-x:auto;
  background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;
}
.tab-nav::-webkit-scrollbar{height:0;}
.tab-btn{
  padding:10px 18px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--text2);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;
  white-space:nowrap;transition:color .15s,border-color .15s;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}

/* ── LAYOUT ── */
.wrap{padding:20px 16px;max-width:680px;margin:0 auto;}

/* ── CP COMPONENTS ── */
.cp-tab-wrap{max-width:600px;margin:24px auto;padding:0 8px;}
.cp-head-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.cp-head-title{font-size:15px;font-weight:600;flex:1;}
.cp-label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;}
.cp-input{
  width:100%;background:var(--bg3);border:1px solid var(--border2);
  color:var(--text);font-family:inherit;font-size:13px;
  padding:9px 11px;border-radius:var(--r2);outline:none;transition:border-color .2s;
}
.cp-input:focus{border-color:var(--accent);}
.cp-btn{
  margin-top:12px;width:100%;padding:12px;border:none;border-radius:var(--r2);
  background:#e52228;color:#fff;font-family:inherit;font-size:14px;font-weight:700;
  cursor:pointer;transition:opacity .2s;
}
.cp-btn:hover{opacity:.85;}
.cp-btn:disabled{opacity:.5;cursor:not-allowed;}
.cp-result{
  margin-top:12px;padding:11px 13px;border-radius:var(--r2);
  font-size:13px;word-break:break-all;line-height:1.6;
  border:1px solid var(--border2);background:var(--bg3);color:var(--text);
}
.cp-result.err{border-color:var(--danger);background:rgba(255,85,85,.06);color:var(--danger);}

/* ── SPINNER ── */
.spin{
  display:inline-block;width:14px;height:14px;
  border:2px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;
}
@keyframes sp{to{transform:rotate(360deg);}}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:22px;right:22px;
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  padding:9px 16px;border-radius:var(--r2);font-size:12px;z-index:9999;
  transform:translateY(60px);opacity:0;transition:all .28s;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{border-color:var(--accent);color:var(--accent);}

/* ── SECTION DIVIDER ── */
.section-divider{
  border:none;border-top:1px solid var(--border);
  margin:28px 0;
}

/* ── 로그인 모달 ── */
.il-modal{display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.85);
  align-items:center;justify-content:center;padding:12px;}
.il-modal.open{display:flex;}
.il-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);
  width:100%;max-width:520px;max-height:94vh;overflow:auto;}
.il-bar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);}
.il-bar b{flex:1;font-size:14px;}
.il-x{background:var(--bg4);border:none;color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;}
.il-status{font-size:12px;color:var(--text2);padding:8px 14px;line-height:1.5;}
.il-status:empty{display:none;}
.il-shot-wrap{position:relative;background:#000;min-height:120px;}
#ilLoading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:13px;}
#ilKbd{width:calc(100% - 28px);margin:10px 14px 14px;padding:9px 11px;background:var(--bg3);
  border:1px solid var(--border2);border-radius:var(--r2);color:var(--text);font-size:13px;outline:none;}

/* ── 검색기 결과 카드 ── */
.sc-grid{display:grid;grid-template-columns:1fr;gap:8px;}
/* 모바일: 가로 행(작은 썸네일 왼쪽) */
.sc-card{display:flex;gap:10px;padding:10px;border:1px solid var(--border2);border-radius:var(--r2);
  background:var(--bg3);align-items:center;}
.sc-thumb{position:relative;flex:0 0 auto;}
.sc-thumb img{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--bg4);display:block;}
.sc-rate-badge{position:absolute;top:3px;left:3px;background:rgba(0,0,0,.62);color:var(--accent);
  font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;}
.sc-body{flex:1;min-width:0;}
.sc-card .scn{font-size:12.5px;line-height:1.4;max-height:36px;overflow:hidden;}
.sc-card .scmeta{font-size:11px;color:var(--text2);margin-top:2px;}
.sc-mini{padding:5px 9px;font-size:11px;border-radius:6px;border:1px solid var(--border2);
  background:var(--bg4);color:var(--text);cursor:pointer;text-decoration:none;display:inline-block;}
.sc-row{display:flex;gap:6px;margin-top:7px;}
/* PC: 세로 카드 4열 + 큰 썸네일 */
@media(min-width:700px){
  .wrap{max-width:1280px;}
  #tab-sc .cp-tab-wrap{max-width:1240px;}
  .sc-grid{grid-template-columns:repeat(4,1fr);gap:14px;}
  .sc-card{flex-direction:column;align-items:stretch;padding:0;gap:0;overflow:hidden;}
  .sc-thumb{width:100%;}
  .sc-thumb img{width:100%;height:auto;aspect-ratio:1/1;border-radius:0;}
  .sc-rate-badge{font-size:15px;top:7px;left:7px;padding:2px 9px;}
  .sc-body{padding:11px 12px 13px;}
  .sc-card .scn{font-size:14px;max-height:42px;}
  .sc-card .scmeta{font-size:12.5px;}
  .sc-mini{font-size:12px;padding:7px 10px;}
}
</style>
</head>
<body>

<header class="header">
  <span class="header-title">📥 호제야 다운받자</span>
  <span class="header-notice">무단배포 적발시 유료화합니다</span>
</header>

<div class="tab-nav">
  <button class="tab-btn active" data-tab="download" onclick="scSwitchTab('download')">📥 영상 다운로드</button>
  <button class="tab-btn" data-tab="sc" onclick="scSwitchTab('sc')">🛒 쇼핑커넥트 검색기</button>
</div>

<div class="wrap">
 <div id="tab-download">
  <div class="cp-tab-wrap">
    <div class="cp-head-row"><span class="cp-head-title">📥 영상 다운로드</span></div>
    <div class="cp-label">틱톡 / 스레드 / 샤오홍슈 URL</div>
    <input class="cp-input" id="_dlUrl" type="text" placeholder="틱톡·스레드·샤오홍슈 링크 붙여넣기" style="font-size:13px;">
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="cp-btn" id="_dlBtn" style="margin-top:0;flex:1;">가져오기</button>
      <button class="cp-btn" id="_dlClear" style="margin-top:0;flex:0 0 auto;width:auto;padding:12px 16px;background:var(--bg4);color:var(--text2);border:1px solid var(--border2);">URL 지우기</button>
    </div>
    <div id="_dlResult" style="display:none;margin-top:16px;"></div>
    <div id="_dlErr" style="display:none;margin-top:12px;" class="cp-result err"></div>
  </div>
 </div><!-- /tab-download -->

 <div id="tab-sc" style="display:none;">
  <div class="cp-tab-wrap">
    <div class="cp-head-row"><span class="cp-head-title">🛒 쇼핑커넥트 수수료 검색기</span></div>

    <!-- 로그아웃 상태: 로그인 안내 -->
    <div id="scOut">
      <div class="cp-result" style="margin-top:0;">
        본인 네이버 아이디로 로그인하면 <b>쇼핑커넥트 제휴상품을 수수료순으로</b> 검색할 수 있어요.<br>
        <span style="color:var(--text3);font-size:11px;">로그인 후 쿠키는 <b>이 브라우저에만</b> 저장돼요.</span>
      </div>
      <div class="cp-label" style="margin-top:14px;">네이버 아이디</div>
      <input class="cp-input" id="scId" type="text" autocomplete="username" placeholder="네이버 아이디">
      <div class="cp-label" style="margin-top:10px;">비밀번호</div>
      <input class="cp-input" id="scPw" type="password" autocomplete="current-password" placeholder="비밀번호">
      <button class="cp-btn" id="scLoginBtn">로그인</button>
      <div id="scLoginStatus" style="display:none;text-align:center;margin-top:10px;font-size:12px;color:var(--text2);"></div>
    </div>

    <!-- 로그인 상태: 검색 -->
    <div id="scIn" style="display:none;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <span style="font-size:12px;color:var(--accent);flex:1;">● 로그인됨 (AFF <span id="scAff"></span>)</span>
        <button class="sc-mini" id="scLogout">로그아웃</button>
      </div>
      <input class="cp-input" id="scQuery" type="text" placeholder="상품 키워드 (예: 무지외반증교정기, 선풍기)">
      <button class="cp-btn" id="scSearchBtn">수수료순 검색</button>
      <div style="display:flex;align-items:center;gap:8px;margin-top:12px;">
        <span style="font-size:11px;color:var(--text2);">정렬</span>
        <select id="scSort" class="cp-input" style="width:auto;flex:1;padding:7px 9px;font-size:12px;margin:0;">
          <option value="rate">수수료율 높은순</option>
          <option value="amt">예상수수료 금액순</option>
          <option value="plow">가격 낮은순</option>
          <option value="phigh">가격 높은순</option>
        </select>
      </div>
      <div id="scResult" style="margin-top:14px;"></div>
    </div>
  </div>
 </div><!-- /tab-sc -->
</div><!-- /wrap -->

<!-- 인터랙티브 네이버 로그인 모달 -->
<div class="il-modal" id="ilModal">
  <div class="il-box">
    <div class="il-bar"><b>네이버 로그인 <span id="ilAccName" style="color:var(--text3);font-weight:400;"></span></b>
      <button class="il-x" onclick="scCloseLogin()">✕</button></div>
    <div class="il-status" id="ilStatus">로그인 중…</div>
    <div class="il-shot-wrap">
      <div id="ilLoading">로그인 중…</div>
      <img id="ilShot" style="width:100%;display:block;cursor:crosshair;" tabindex="0" alt="">
    </div>
    <input id="ilKbd" placeholder="여기에 입력 (아이디·비번·캡차) — 위 화면 입력칸 먼저 클릭">
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script>
// ── 상수 ──────────────────────────────────────────────────────────────────────
const PROXY       = 'https://corsproxy.io/?';
const MEDIA_PROXY = 'https://media-proxy.billivilli.workers.dev/?url=';
const CP_THREADS_API = 'https://media-proxy.billivilli.workers.dev/threads-images';

// ── 토스트 ────────────────────────────────────────────────────────────────────
let _toastTimer;
function toast(msg, ok){
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.className = 'toast show' + (ok ? ' ok' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// (탭 제거 — 통합 다운로더)

// ── 미디어 fetching (MEDIA_PROXY 우선) ───────────────────────────────────────
async function _fetchBlob(url){
  for(const target of [
    MEDIA_PROXY + encodeURIComponent(url),
    url,
    PROXY + encodeURIComponent(url),
  ]){
    try{
      const r = await fetch(target);
      if(r.ok) return await r.blob();
    } catch(e){}
  }
  return null;
}

// ── 미디어 저장 ───────────────────────────────────────────────────────────────
async function dlMedia(url, filename){
  toast('다운로드 중...', true);
  const isVideo = filename.endsWith('.mp4');
  const mime    = isVideo ? 'video/mp4' : 'image/jpeg';
  const isIOS   = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  const blob = await _fetchBlob(url);
  if(blob){
    const file = new File([blob], filename, {type: mime});
    if(isIOS && navigator.canShare?.({files:[file]})){
      try{ await navigator.share({files:[file], title: filename}); return; }
      catch(e){ if(e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toast('다운로드 완료 ✓', true);
    return;
  }
  window.open(MEDIA_PROXY + encodeURIComponent(url), '_blank');
  toast('파일 저장 화면이 열립니다');
}

// ── 영상 저장 오버레이 (iOS 꾹 누르기 안내) ──────────────────────────────────
function _showVideoSaveOverlay(videoUrl){
  const old = document.getElementById('_vidSaveOverlay');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = '_vidSaveOverlay';
  overlay.style.cssText = `
    position:fixed;inset:0;z-index:9999;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  `;
  overlay.innerHTML = `
    <div style="position:absolute;top:14px;right:14px;">
      <button id="_vidOverlayClose" style="background:rgba(255,255,255,0.15);border:none;color:#fff;
        width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1;">✕</button>
    </div>
    <video src="${videoUrl}" controls playsinline autoplay
      style="width:100%;max-height:70vh;object-fit:contain;"></video>
    <div style="text-align:center;padding:0 24px;">
      <div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:8px;">📱 영상을 꾹 눌러 저장하세요</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.7);line-height:1.7;">
        위 영상에서 손가락으로 <b style="color:#fff">꾹 누르기</b><br>
        → <b style="color:#4ade80">"비디오 저장"</b> 선택<br>
        <span style="font-size:11px;color:rgba(255,255,255,0.45);">(iOS Safari · Android Chrome 지원)</span>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('_vidOverlayClose').onclick = () => overlay.remove();
}

// ════════════════════════════════════════════════════════════
//  영상 다운로드 (틱톡 / 스레드 / 샤오홍슈 자동감지)
// ════════════════════════════════════════════════════════════
(function(){
  const q = id => document.getElementById(id);
  q('_dlClear').onclick = () => { q('_dlUrl').value=''; q('_dlResult').style.display='none'; q('_dlResult').innerHTML=''; q('_dlErr').style.display='none'; q('_dlUrl').focus(); };
  q('_dlBtn').onclick = async () => {
    const url = q('_dlUrl').value.trim();
    if(!url){ toast('URL을 입력해주세요'); return; }
    const btn = q('_dlBtn'); btn.disabled=true; const ot=btn.textContent; btn.innerHTML='<span class="spin"></span> 분석 중...';
    q('_dlResult').style.display='none'; q('_dlResult').innerHTML=''; q('_dlErr').style.display='none';
    try{
      let videos=[], images=[], platform='';
      if(/tiktok\.com|vt\.tiktok|vm\.tiktok/i.test(url)){
        platform='틱톡';
        const j=await (await fetch('https://tikwm.com/api/?url='+encodeURIComponent(url)+'&hd=1',{signal:AbortSignal.timeout(20000)})).json();
        if(j.code!==0||!j.data) throw new Error(j.msg||'틱톡 정보를 가져올 수 없습니다');
        if(j.data.play) videos=[j.data.play];
        if(j.data.images) images=j.data.images;
      } else if(/threads\.(net|com)/i.test(url)){
        platform='스레드';
        const d=await (await fetch(CP_THREADS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url}),signal:AbortSignal.timeout(25000)})).json();
        if(d.error) throw new Error(d.error); videos=d.videos||[]; images=d.images||[];
      } else if(/xhslink\.com|xiaohongshu\.com/i.test(url)){
        platform='샤오홍슈';
        const d=await (await fetch('https://cp-converter.vercel.app/api/xhs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url}),signal:AbortSignal.timeout(25000)})).json();
        if(d.error) throw new Error(d.error); videos=d.videos||[]; images=d.images||[];
      } else { throw new Error('지원하지 않는 URL (틱톡/스레드/샤오홍슈)'); }
      const total=videos.length+images.length;
      if(!total) throw new Error('미디어를 찾을 수 없습니다');
      const cont=q('_dlResult'); const ts=Date.now();
      const slider=document.createElement('div');
      slider.style.cssText='display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:6px;';
      const mk=(kind,u,idx,cnt)=>{
        const it=document.createElement('div');
        it.style.cssText='flex:0 0 70%;scroll-snap-align:start;position:relative;aspect-ratio:4/3;background:#000;border-radius:10px;overflow:hidden;';
        const psrc = MEDIA_PROXY+encodeURIComponent(u);
        it.innerHTML = (kind==='video'
          ? '<video src="'+psrc+'" controls playsinline style="width:100%;height:100%;object-fit:contain;background:#000;"></video>'
          : '<img src="'+psrc+'" style="width:100%;height:100%;object-fit:contain;background:#000;">')
          + '<span style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;pointer-events:none;">'+(kind==='video'?'🎬':'🖼️')+(cnt>1?' '+(idx+1):'')+'</span>';
        return it;
      };
      videos.forEach((u,i)=>slider.appendChild(mk('video',u,i,videos.length)));
      images.forEach((u,i)=>slider.appendChild(mk('image',u,i,images.length)));
      cont.appendChild(slider);
      const dlRow=document.createElement('div'); dlRow.style.cssText='display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;';
      const mkDl=(kind,u,idx,cnt)=>{
        const fname = kind==='video' ? platform+'_'+ts+'_v'+(idx+1)+'.mp4' : platform+'_'+ts+'_'+(idx+1)+'.jpg';
        const b=document.createElement('button'); b.className='cp-btn'; b.style.cssText='margin:0;flex:1 1 130px;font-size:13px;';
        b.textContent='📥 '+(kind==='video'?'영상':'사진')+(cnt>1?' '+(idx+1):'')+' 다운로드';
        b.onclick=async function(){ const o=this.textContent; this.disabled=true; this.textContent='다운로드 중...'; try{ await dlMedia(u, fname); } finally{ this.disabled=false; this.textContent=o; } };
        return b;
      };
      videos.forEach((u,i)=>dlRow.appendChild(mkDl('video',u,i,videos.length)));
      images.forEach((u,i)=>dlRow.appendChild(mkDl('image',u,i,images.length)));
      cont.appendChild(dlRow);
      cont.style.display='block';
      toast(platform+' 미디어 '+total+'개', true);
    }catch(e){ q('_dlErr').style.display='block'; q('_dlErr').textContent='오류: '+(e.name==='TimeoutError'?'시간초과(다시 시도)':e.message); }
    finally{ btn.disabled=false; btn.innerHTML=ot; }
  };
})();

// ════════════════════════════════════════════════════════════
//  쇼핑커넥트 수수료 검색기
// ════════════════════════════════════════════════════════════
const SC_API = 'https://atrd.kr/api/sc';
const _scq = id => document.getElementById(id);

function scSwitchTab(t){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  _scq('tab-download').style.display = t==='download' ? '' : 'none';
  _scq('tab-sc').style.display = t==='sc' ? '' : 'none';
  if(t==='sc') scRefreshAuth();
}
function scCookies(){ try{ return JSON.parse(localStorage.getItem('sc_cookies')||'null'); }catch(e){ return null; } }
function scAff(){ return localStorage.getItem('sc_affid')||''; }
function scRefreshAuth(){
  const ck = scCookies(); const on = ck && ck.length;
  _scq('scOut').style.display = on ? 'none' : '';
  _scq('scIn').style.display  = on ? '' : 'none';
  if(on) _scq('scAff').textContent = scAff()||'?';
}

// ── 네이버 로그인: 폼 자동로그인 시도 → 캡차/실패 시에만 모달 ──
var _il = { sid:null, poll:null, busy:false, ticks:0, modalShown:false, vp:{width:1024,height:760} };
function _scLoginUI(on){ const b=_scq('scLoginBtn'), s=_scq('scLoginStatus'); b.disabled=on; s.style.display=on?'block':'none'; if(on) s.innerHTML='<span class="spin"></span> 로그인 중…'; }
async function scLogin(){
  const id=_scq('scId').value.trim(), pw=_scq('scPw').value;
  if(!id||!pw){ toast('아이디·비밀번호를 입력하세요'); return; }
  _il.sid=null; _il.ticks=0; _il.modalShown=false;
  _scq('ilShot').src=''; _scq('ilLoading').style.display=''; _scq('ilKbd').value=''; _scq('ilStatus').textContent='';
  _scLoginUI(true);
  try{
    const r = await fetch(SC_API+'/login/start', {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:id, password:pw})});
    const d = await r.json();
    if(!d.sessionId) throw new Error(d.error||'세션 시작 실패');
    _il.sid=d.sessionId; if(d.viewport) _il.vp=d.viewport;
    if(_il.poll) clearInterval(_il.poll);
    _il.poll=setInterval(_scTick,1200); _scTick();
  }catch(e){ _scLoginUI(false); toast('오류: '+e.message); }
}
function _scShowModal(){
  _il.modalShown=true;
  _scq('ilStatus').textContent='추가 인증(캡차·기기인증)이 필요해요. 화면에서 풀어주세요.';
  _scq('ilModal').classList.add('open');
  const s=_scq('scLoginStatus'); s.innerHTML='추가 인증 창을 띄웠어요';
}
async function _scTick(){
  if(!_il.sid||_il.busy) return;
  _il.busy=true; _il.ticks++;
  try{
    const r=await fetch(SC_API+'/login/'+_il.sid+'/shot');
    const d=await r.json();
    if(d.done){
      _scStop();
      if(d.success && d.cookies && d.cookies.length){
        localStorage.setItem('sc_cookies', JSON.stringify(d.cookies));
        if(d.affId) localStorage.setItem('sc_affid', d.affId);
        _scq('ilModal').classList.remove('open'); _scLoginUI(false);
        toast('로그인 성공!', true); scRefreshAuth();
      } else {
        if(!_il.modalShown) _scShowModal();
        _scq('ilStatus').textContent='로그인 실패: '+(d.error||'아이디·비번을 확인하세요');
        _scLoginUI(false);
      }
      _il.busy=false; return;
    }
    if(d.png){ _scq('ilLoading').style.display='none'; _scq('ilShot').src='data:image/jpeg;base64,'+d.png; }
    // 자동로그인이 ~7초 내 안 끝나면(캡차/인증) 모달 띄움
    if(!_il.modalShown && _il.ticks>=6) _scShowModal();
  }catch(e){}
  _il.busy=false;
}
function _scStop(){ if(_il.poll){ clearInterval(_il.poll); _il.poll=null; } }
function scCloseLogin(){
  _scStop();
  if(_il.sid){ try{ fetch(SC_API+'/login/'+_il.sid+'/cancel',{method:'POST'}); }catch(e){} }
  _il.sid=null; _scq('ilModal').classList.remove('open'); _scLoginUI(false);
}
function _scPost(action, body){
  if(!_il.sid) return;
  fetch(SC_API+'/login/'+_il.sid+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
}
(function(){
  const img=_scq('ilShot');
  if(img) img.addEventListener('click',function(e){
    if(!_il.sid) return;
    const rect=img.getBoundingClientRect();
    const x=Math.round((e.clientX-rect.left)*(_il.vp.width/rect.width));
    const y=Math.round((e.clientY-rect.top)*(_il.vp.height/rect.height));
    _scPost('click',{x:x,y:y});
    const k=_scq('ilKbd'); if(k) k.focus();
  });
  const kbd=_scq('ilKbd');
  if(kbd) kbd.addEventListener('keydown',function(e){
    if(!_il.sid) return;
    const special={Enter:'Enter',Backspace:'Backspace',Tab:'Tab',Delete:'Delete',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown'};
    if(special[e.key]){ e.preventDefault(); _scPost('key',{key:special[e.key]}); }
    else if(e.key.length===1){ e.preventDefault(); _scPost('type',{text:e.key}); }
  });
})();

// ── 검색 + 수수료 정렬 ──
let _scProducts=[];
function scSortProducts(){
  const m=_scq('scSort').value, a=_scProducts.slice();
  if(m==='rate') a.sort((x,y)=>(y.commission||0)-(x.commission||0));
  else if(m==='amt') a.sort((x,y)=>(y.commissionPrice||0)-(x.commissionPrice||0));
  else if(m==='plow') a.sort((x,y)=>(x.price||0)-(y.price||0));
  else if(m==='phigh') a.sort((x,y)=>(y.price||0)-(x.price||0));
  return a;
}
function scRender(){
  const cont=_scq('scResult'), arr=scSortProducts(), won=n=>(n||0).toLocaleString('ko-KR');
  if(!arr.length){ cont.innerHTML='<div class="cp-result">검색 결과가 없습니다.</div>'; return; }
  cont.innerHTML='<div style="font-size:11px;color:var(--text2);margin-bottom:8px;">'+arr.length+'개</div>'+
    '<div class="sc-grid">'+
    arr.map(p=>'<div class="sc-card">'+
      '<div class="sc-thumb">'+
        '<img src="'+(p.image||'')+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">'+
        '<span class="sc-rate-badge">수수료 '+(p.commission||0)+'%</span>'+
      '</div>'+
      '<div class="sc-body">'+
        '<div class="scn">'+(p.name||'')+'</div>'+
        '<div class="scmeta">'+won(p.price)+'원 · '+(p.store||'')+'</div>'+
        '<div class="scmeta">예상수수료 '+won(p.commissionPrice)+'원</div>'+
        '<div class="sc-row">'+
          '<a class="sc-mini" href="'+(p.productUrl||'#')+'" target="_blank" rel="noopener">상품 열기</a>'+
          '<button class="sc-mini" onclick="scIssue(this,\''+(p.id||'')+'\')">🔗 발급</button>'+
        '</div>'+
      '</div>'+
    '</div>').join('')+
    '</div>';
}
function scCopy(t){ if(!t) return; navigator.clipboard?.writeText(t).then(()=>toast('제휴링크 복사됨',true),()=>toast('복사 실패')); }
async function scIssue(btn, id){
  if(!id){ toast('상품 ID 없음'); return; }
  const ck=scCookies(); if(!ck){ toast('먼저 로그인하세요'); scRefreshAuth(); return; }
  const o=btn.textContent; btn.disabled=true; btn.innerHTML='<span class="spin"></span> 발급 중...';
  try{
    const r=await fetch(SC_API+'/issue-link',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cookies:ck, affId:scAff(), productId:id})});
    const d=await r.json();
    if(r.status===401){ toast('세션 만료 — 다시 로그인'); localStorage.removeItem('sc_cookies'); scRefreshAuth(); return; }
    if(d.error||!d.url) throw new Error(d.error||'발급 실패');
    btn.textContent='✓ 발급완료'; btn.disabled=true;
    btn.style.color='var(--accent)'; btn.style.borderColor='var(--accent)';
    toast('제휴링크 발급완료', true);
  }catch(e){ btn.disabled=false; btn.textContent=o; toast('발급 실패: '+e.message); }
}
async function scDoSearch(){
  const q=_scq('scQuery').value.trim();
  if(!q){ toast('검색어를 입력하세요'); return; }
  const ck=scCookies();
  if(!ck){ toast('먼저 로그인하세요'); scRefreshAuth(); return; }
  const btn=_scq('scSearchBtn'); btn.disabled=true; const o=btn.textContent; btn.innerHTML='<span class="spin"></span> 검색 중...';
  _scq('scResult').innerHTML='';
  try{
    const r=await fetch(SC_API+'/search',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cookies:ck, affId:scAff(), query:q})});
    const d=await r.json();
    if(r.status===401){ toast('세션 만료 — 다시 로그인'); localStorage.removeItem('sc_cookies'); scRefreshAuth(); return; }
    if(d.error) throw new Error(d.error);
    if(d.affId && d.affId!==scAff()) localStorage.setItem('sc_affid', d.affId);
    _scProducts=d.products||[]; scRender();
    toast(_scProducts.length+'개 검색됨', true);
  }catch(e){ _scq('scResult').innerHTML='<div class="cp-result err">오류: '+e.message+'</div>'; }
  finally{ btn.disabled=false; btn.innerHTML=o; }
}
_scq('scLoginBtn').onclick=scLogin;
_scq('scPw').addEventListener('keydown',e=>{ if(e.key==='Enter') scLogin(); });
_scq('scLogout').onclick=()=>{ localStorage.removeItem('sc_cookies'); localStorage.removeItem('sc_affid'); _scProducts=[]; _scq('scResult').innerHTML=''; scRefreshAuth(); toast('로그아웃됨'); };
_scq('scSearchBtn').onclick=scDoSearch;
_scq('scQuery').addEventListener('keydown',e=>{ if(e.key==='Enter') scDoSearch(); });
_scq('scSort').addEventListener('change',scRender);
scRefreshAuth();
</script>
